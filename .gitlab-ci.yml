stages:
  - test
  - mirror

variables:
  NODE_ENV: test
  CI: "true"

cache:
  paths:
    - node_modules/

test_backend:
  stage: test
  image: node:18
  script:
    - cd PlayAble/server
    - npm install
    - npm test -- --passWithNoTests || exit_code=$?
    - |
      if [ ! -z "$exit_code" ] && [ $exit_code -ne 0 ]; then
        echo "Tests failed, but allowing pipeline to continue with warning"
        exit 0
      fi
  allow_failure: true
  only:
    - main
    - merge_requests

test_frontend:
  stage: test
  image: node:18
  script:
    - cd PlayAble/client
    - npm install
    - npm test --passWithNoTests || exit_code=$?
    - |
      if [ ! -z "$exit_code" ] && [ $exit_code -ne 0 ]; then
        echo "Tests failed, but allowing pipeline to continue with warning"
        exit 0
      fi
  allow_failure: true
  only:
    - main
    - merge_requests

trigger_mirror:
  stage: mirror
  script:
    - echo "GitLab mirroring will push to GitHub automatically."
  only:
    - main
  when: always