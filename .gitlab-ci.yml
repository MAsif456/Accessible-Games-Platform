stages:
  - test
  - mirror
  - deploy   # NEW stage

variables:
  NODE_ENV: test
  CI: "true"

cache:
  paths:
    - node_modules/

test_backend:
  stage: test
  image: node:18
  script:
    - cd PlayAble/server
    - npm install
    - npm test -- --passWithNoTests || exit_code=$?
    - |
      if [ ! -z "$exit_code" ] && [ $exit_code -ne 0 ]; then
        echo "Tests failed, but allowing pipeline to continue with warning"
        exit 0
      fi
  allow_failure: true
  only:
    - main
    - merge_requests

test_frontend:
  stage: test
  image: node:18
  script:
    - cd PlayAble/client
    - npm install
    - npm test --passWithNoTests || exit_code=$?
    - |
      if [ ! -z "$exit_code" ] && [ $exit_code -ne 0 ]; then
        echo "Tests failed, but allowing pipeline to continue with warning"
        exit 0
      fi
  allow_failure: true
  only:
    - main
    - merge_requests

# -------------------------------
# NEW JOB: Deploy TypeDoc to GitLab Pages
# -------------------------------

pages:
  stage: deploy
  image: node:18
  script:
    # Install dependencies and generate client docs
    - cd PlayAble/client
    - npm install
    - npm run docs

    # Install dependencies and generate server docs
    - cd ../server
    - npm install
    - npm run docs

    # Go back to project root
    - cd ../..

    # GitLab Pages folder MUST be named 'public'
    - mkdir public

    # Copy documentation into public/
    - cp -r PlayAble/client/docs public/client
    - cp -r PlayAble/server/docs public/server

  artifacts:
    paths:
      - public   # GitLab Pages publishes this folder
  only:
    - main       # Only deploy Pages when main branch is updated

trigger_mirror:
  stage: mirror
  script:
    - echo "GitLab mirroring will push to GitHub automatically."
  only:
    - main
  when: always
