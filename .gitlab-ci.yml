stages:
  - test
  - mirror

variables:
  NODE_ENV: test
  CI: "true"

cache:
  paths:
    - node_modules/

test_backend:
  stage: test
  image: node:18
  script:
    - cd PlayAble/server
    - npm install
    - npm test -- --passWithNoTests
  only:
    - main
    - merge_requests

test_frontend:
  stage: test
  image: node:18
  script:
    - cd PlayAble/client
    - npm install
    - npm test --passWithNoTests
  only:
    - main
    - merge_requests

trigger_mirror:
  stage: mirror
  script:
    - echo "GitLab mirroring will push to GitHub automatically."
  only:
    - main
